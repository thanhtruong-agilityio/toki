/* accent presets */
[data-eff="calm"][data-accent="indigo"]{--accent:#4F46E5;--accent-soft:#E3E5FB;--accent-text:#3730A3}
[data-eff="calm"][data-accent="clay"]{--accent:#B4532A;--accent-soft:#F6E3DA;--accent-text:#8A3A17}
[data-eff="calm"][data-accent="violet"]{--accent:#7C3AED;--accent-soft:#EBE3FB;--accent-text:#5B21B6}

body{background:var(--bg);color:var(--ink)}
html,body{height:100%}
*{box-sizing:border-box}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--accent-text)}
.mono,time,.kbd,[data-timer]{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;letter-spacing:-.01em}
.ic{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#root{height:100%;display:flex;flex-direction:column;background:var(--bg)}
/* protobar */
.protobar{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--surface-2);border-bottom:1px dashed var(--line);font-size:12.5px;z-index:5}
.protobar .wm{font-weight:700;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.pill.idea{background:var(--idea-soft);color:var(--idea);padding:1px 7px;font-size:10.5px;letter-spacing:.02em}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px}
.seg button{padding:4px 12px;border-radius:99px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pb-grow{flex:1}
.pb-lbl{color:var(--muted);font-size:11.5px;margin-right:6px}
.pb-group{display:flex;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:0 14px;height:34px;border-radius:var(--radius-sm);font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--hover);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.danger{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);filter:brightness(1.08)}
.btn.live{background:var(--live);color:var(--on-live);border-color:var(--live)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--radius-sm);color:var(--ink-2);transition:background .15s,color .15s}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.on{background:var(--accent-soft);color:var(--accent-text)}
.ib.sm{width:28px;height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:99px;font-size:12.5px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"],.chip.on{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:99px;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.cnt.mute{background:var(--hover);color:var(--ink-2)}
.cnt.mn{background:var(--danger);color:var(--surface)}
/* stage + device */
.stage{flex:1;min-height:0;position:relative;display:flex}
.device{position:relative;flex:1;min-width:0;height:100%;container-type:inline-size;container-name:app;overflow:hidden}
@media (min-width:720px){
 .stage[data-device="phone"]{background:color-mix(in srgb,var(--bg) 92%,var(--ink));align-items:center;justify-content:center;padding:16px}
 .stage[data-device="phone"] .device{flex:none;width:390px;height:min(844px,100%);border-radius:32px;border:1px solid var(--line);box-shadow:var(--pop);background:var(--bg)}
}
.app{position:absolute;inset:0;display:grid;background:var(--bg);overflow:hidden}
.app > *{min-width:0;min-height:0}
/* avatar */
.av{--s:var(--av);width:var(--s);height:var(--s);flex:none;border-radius:30%;display:inline-grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.38);letter-spacing:.01em;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--av-ts) var(--av-tl));position:relative;user-select:none}
.av .pd{position:absolute;right:-3px;bottom:-3px}
.pd{width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);background:var(--accent);display:inline-block;flex:none;box-sizing:border-box}
.pd.away{background:var(--surface);border-color:var(--muted);border-width:2px}
.pd.meet{background:var(--live)}
.pd.dnd{background:var(--danger)}
.tag{font-size:10.5px;font-weight:600;border-radius:5px;padding:0 6px;background:var(--hover);color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;line-height:17px;display:inline-block}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{overflow-y:auto;overscroll-behavior:contain}
.title{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.015em;margin:0}
/* ---- nav (Calm default) ---- */
.nav{display:contents}
.navtop{grid-area:navtop;display:flex;flex-direction:column;padding:14px 12px 6px;gap:2px;min-height:0}
.ws{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.ws .wsl{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px}
.ws .wsn{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.ws .wss{font-size:11.5px;color:var(--muted)}
.srch{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);color:var(--muted);margin-bottom:8px;width:100%;transition:border-color .15s}
.srch:hover{border-color:var(--muted)}
.srch .kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface-2)}
.nav-items{display:flex;flex-direction:column;gap:1px}
.ni{display:flex;align-items:center;gap:10px;height:var(--row);padding:0 10px;border-radius:var(--radius-sm);color:var(--ink-2);font-weight:500;width:100%;transition:background .15s,color .15s;position:relative}
.ni:hover{background:var(--hover);color:var(--ink)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.ni .cnt{margin-left:auto}
.ni .lb{white-space:nowrap}
.nav-tabs{display:none}
.usercard{grid-area:user;padding:8px 12px 12px}
.ucard{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);width:100%;transition:background .15s}
.ucard:hover{background:var(--hover)}
.ucard .un{font-weight:600;line-height:1.2}
.ucard .us{font-size:12px;color:var(--muted)}
.app{grid-template-columns:272px minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"navtop main side" "convs main side" "user main side"}
.convs{grid-area:convs;display:flex;flex-direction:column;min-height:0}
.main{grid-area:main;display:flex;flex-direction:column;position:relative;background:var(--surface);min-height:0;min-width:0;overflow:hidden}
.side{grid-area:side;display:none;flex-direction:column;width:360px;background:var(--surface);min-height:0}
.app[data-panel] .side{display:flex}
[data-eff="calm"] .main{margin:12px 12px 12px 0;border-radius:var(--radius);box-shadow:var(--shadow)}
[data-eff="calm"] .side{margin:12px 12px 12px 0;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
[data-eff="calm"] .app:not([data-panel]) .main{margin-right:12px}
/* focus */
[data-eff="focus"] .app{grid-template-columns:68px minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);grid-template-areas:"nav main side"}
[data-eff="focus"] .app[data-section="home"]{grid-template-columns:68px 288px minmax(0,1fr) auto;grid-template-areas:"nav convs main side"}
[data-eff="focus"] .nav{display:flex;flex-direction:column;grid-area:nav;background:var(--bg);border-right:1px solid var(--line);align-items:stretch;padding:10px 0;overflow:hidden}
[data-eff="focus"] .navtop{padding:0 8px;align-items:stretch;flex:1;gap:4px}
[data-eff="focus"] .ws{padding:0;justify-content:center;margin-bottom:6px}
[data-eff="focus"] .ws>div:last-child{display:none}
[data-eff="focus"] .srch{height:36px;justify-content:center;padding:0;background:transparent;border-color:transparent;margin-bottom:6px}
[data-eff="focus"] .srch:hover{background:var(--hover)}
[data-eff="focus"] .srch .t,[data-eff="focus"] .srch .kbd{display:none}
[data-eff="focus"] .ni{flex-direction:column;justify-content:center;gap:3px;height:52px;padding:0;font-size:10.5px;font-weight:500}
[data-eff="focus"] .ni .ic{width:20px;height:20px}
[data-eff="focus"] .ni .cnt{position:absolute;top:3px;right:6px;margin:0;min-width:16px;height:16px;font-size:10px}
[data-eff="focus"] .usercard{padding:6px 8px 0}
[data-eff="focus"] .ucard{justify-content:center;padding:6px}
[data-eff="focus"] .ucard>div:not(.av){display:none}
[data-eff="focus"] .convs{border-right:1px solid var(--line);background:var(--bg)}
[data-eff="focus"] .app:not([data-section="home"]) .convs{display:none}
[data-eff="focus"] .side{border-left:1px solid var(--line)}
[data-eff="focus"] .app[data-section="home"] .main{background:var(--surface)}
/* convs list */
.ch{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 20px}
.ch h2{margin:0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;flex:1}
[data-eff="focus"] .ch{padding:12px 14px 6px}
.cfilter{padding:2px 16px 8px;display:flex;flex-direction:column;gap:8px}
.cfilter .chip{height:26px}
.field{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:0 10px;color:var(--muted);transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--ink)}
.field input::placeholder{color:var(--muted)}
.clist{flex:1;overflow-y:auto;padding:0 12px 12px;overscroll-behavior:contain}
.sec{display:flex;align-items:center;gap:4px;width:100%;padding:10px 8px 4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sec:hover{color:var(--ink)}
.sec .ic{width:14px;height:14px;transition:transform .15s}
.sec.fold .ic{transform:rotate(-90deg)}
.cr{display:flex;align-items:center;gap:9px;width:100%;min-height:var(--row);padding:3px 10px;border-radius:var(--radius-sm);color:var(--ink-2);transition:background .15s;position:relative}
.cr:hover{background:var(--hover)}
.cr[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text)}
.cr .gl{width:18px;display:grid;place-items:center;color:var(--muted);flex:none}
.cr[aria-current="true"] .gl{color:var(--accent-text)}
.cr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr.un .nm{font-weight:700;color:var(--ink)}
.cr[aria-current="true"].un .nm{color:var(--accent-text)}
.cr.mutec .nm{color:var(--muted)}
.cr .draft{font-size:11px;color:var(--muted);font-style:italic}
.cr .av{--s:24px}
.cr .pdw{position:relative;display:inline-grid;flex:none}
.cr .pdw .pd{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px}
.cr .live{width:8px;height:8px;border-radius:50%;background:var(--live)}
/* main header & tabs */
.mh{display:flex;align-items:center;gap:10px;padding:14px 20px 0;min-height:56px}
[data-eff="focus"] .mh{padding:10px 16px 0;min-height:48px}
.mh .back{display:none}
.mh h1{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.mh .topic{font-size:12.5px;color:var(--muted);margin-top:1px}
.tabs{display:flex;gap:2px;padding:6px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.searchbar{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--line);color:var(--muted)}
.searchbar input{flex:1;border:0;background:transparent;outline:0;color:var(--ink)}
.banner{display:flex;align-items:center;gap:10px;margin:10px 20px 0;padding:8px 12px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent-text);font-weight:500}
.banner.live{background:color-mix(in srgb,var(--live) 12%,var(--surface));color:var(--ink)}
.banner .ldot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
.strip{display:flex;align-items:center;gap:10px;padding:7px 20px;background:var(--idea-soft);color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--line)}
.strip.pause{background:var(--mention-bg);color:var(--mention-ink)}
.strip .btn{height:24px;font-size:12px;padding:0 10px;background:transparent}
@keyframes pulse{50%{opacity:.35}}
/* messages */
.msgs{flex:1;overflow-y:auto;padding:8px 8px 12px;min-height:0;overscroll-behavior:contain}
.day{display:flex;align-items:center;gap:12px;margin:16px 12px 8px;color:var(--muted);font-size:12px;font-weight:600}
.day::before,.day::after{content:"";height:1px;background:var(--line);flex:1}
.msg{position:relative;display:flex;gap:12px;padding:calc(var(--gap)/2) 12px;border-radius:var(--radius-sm);margin-top:calc(var(--gap)/2);transition:background .15s}
.msg.grp{margin-top:0}
.msg:hover,.msg.act{background:var(--surface-2)}
.msg.mentioned{background:var(--mention-bg);}
.msg.mentioned:hover{background:var(--mention-bg)}
.msg.hl{animation:hl 2.2s ease-out}
@keyframes hl{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
.avbtn{align-self:flex-start;display:block;flex:none;line-height:0}
.msg .gut{width:var(--av);flex:none;font-size:11px;color:var(--muted);text-align:right;padding-top:3px;opacity:0}
.msg:hover .gut{opacity:1}
.msg .bd{flex:1;min-width:0}
.msg .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .who{font-weight:700;cursor:pointer}
.msg .who:hover{text-decoration:underline}
.msg .tm{font-size:11.5px;color:var(--muted)}
.msg .ed{font-size:11.5px;color:var(--muted);font-style:italic}
.msg .pn{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--accent-text);font-weight:600}
.msg .pn .ic{width:12px;height:12px}
.msg .tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg code,.tx code{font-family:"JetBrains Mono",monospace;font-size:.92em;background:var(--hover);padding:1px 5px;border-radius:5px}
.mention{background:var(--mention-bg);color:var(--mention-ink);border-radius:5px;padding:0 3px;font-weight:600}
.msg.mentioned .mention{background:transparent;padding:0}
.lnk{color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}
.acts{display:none;position:absolute;right:12px;top:-16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--pop);padding:2px;gap:0;z-index:2}
.msg:hover .acts,.msg:focus-within .acts,.msg.act .acts{display:flex}
.acts .ib{width:30px;height:30px}
.rxs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rx{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;transition:background .15s,border-color .15s}
.rx:hover{border-color:var(--muted)}
.rx.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.rx .n{font-variant-numeric:tabular-nums;font-size:12px}
.tlink{display:inline-flex;align-items:center;gap:8px;margin-top:6px;color:var(--accent-text);font-weight:600;font-size:12.5px;padding:2px 6px 2px 2px;border-radius:7px}
.tlink:hover{background:var(--accent-soft)}
.tlink .av{--s:20px;margin-right:-10px;border:2px solid var(--surface)}
.tlink .av:last-of-type{margin-right:0}
.taskchip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;margin-right:6px;height:26px;padding:0 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.taskchip:hover{border-color:var(--accent)}
.later-ic{color:var(--accent-text)}
.typing{padding:4px 16px 4px 60px;color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
/* attachments */
.att{margin-top:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:100%}
.card{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:10px 12px;max-width:440px;width:100%}
.fcard{display:flex;align-items:center;gap:12px;transition:border-color .15s;cursor:pointer}
.fcard:hover{border-color:var(--muted)}
.fic{width:38px;height:38px;border-radius:9px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;flex:none}
.fic.img{background:var(--accent-soft);color:var(--accent-text)}
.fic.lnk2{background:var(--idea-soft);color:var(--idea)}
.imgph{position:relative;width:min(300px,100%);aspect-ratio:4/3;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line);overflow:hidden;cursor:pointer}
.imgph .ph1{position:absolute;left:50%;top:50%;width:34%;height:76%;transform:translate(-50%,-50%);border:3px solid var(--ink-2);border-radius:14px;background:var(--surface)}
.imgph .ph2{position:absolute;left:50%;top:34%;width:22%;height:6%;transform:translateX(-50%);background:var(--accent-soft);border-radius:4px}
.imgph .ph3{position:absolute;left:50%;top:52%;width:22%;height:7%;transform:translateX(-50%);background:var(--accent);border-radius:5px}
.imgph .lbl{position:absolute;left:8px;bottom:8px;right:8px;font-size:11.5px;background:var(--surface);border-radius:6px;padding:2px 8px;color:var(--ink-2);width:fit-content;max-width:calc(100% - 16px)}
.imgph.big{width:100%;max-width:520px}
.poll .q{font-weight:600;margin-bottom:8px}
.po{position:relative;display:block;width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:6px;overflow:hidden;padding:7px 10px;transition:border-color .15s}
.po:hover{border-color:var(--muted)}
.po .bar{position:absolute;left:0;top:0;bottom:0;background:var(--hover);transition:width .3s}
.po.mine{border-color:var(--accent)}
.po.mine .bar{background:var(--accent-soft)}
.po .pr{position:relative;display:flex;align-items:center;gap:8px}
.po .vs{display:flex}
.po .vs .av{--s:18px;margin-left:-5px;border:1.5px solid var(--surface)}
.vc{display:flex;align-items:center;gap:10px}
.vc .pbtn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.wf{display:flex;align-items:center;gap:2px;height:28px;flex:1}
.wf i{display:block;width:3px;border-radius:2px;background:var(--line);height:calc(var(--bh)*1%);transition:background .1s}
.wf i.on{background:var(--accent)}
.vc.playing .wf i{animation:wv .8s ease-in-out infinite;animation-delay:calc(var(--i)*40ms)}
@keyframes wv{50%{transform:scaleY(.55)}}
.sumcard{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 12px;background:var(--surface-2)}
.sumcard h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.sumcard ul{margin:4px 0 10px;padding-left:18px}
.sumcard li{margin:3px 0}
.sumcard .sl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.linkbtn{color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:12.5px;display:inline}
/* composer */
.composer{padding:0 20px 16px;position:relative}
[data-eff="focus"] .composer{padding:0 16px 12px}
.cbox{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cbox textarea{display:block;width:100%;border:0;background:transparent;outline:0;resize:none;padding:12px 14px 4px;min-height:44px;max-height:160px;line-height:1.45;color:var(--ink)}
.cbox textarea::placeholder{color:var(--muted)}
.ctools{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px 8px 8px}
.ctools .sp{flex:1}
.sendg{display:flex}
.sendg .btn{border-radius:var(--radius-sm) 0 0 var(--radius-sm);height:32px}
.sendg .caret{width:28px;height:32px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border-left:1px solid color-mix(in srgb,var(--on-accent) 30%,transparent)}
.sendg .caret:hover{filter:brightness(1.07)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 8px;font-size:12.5px}
.sched{display:flex;align-items:center;gap:8px;padding:6px 12px;margin-bottom:6px;border-radius:var(--radius-sm);background:var(--idea-soft);font-size:12.5px}
.mpop{position:absolute;left:34px;bottom:100%;margin-bottom:-8px;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--pop);padding:4px;z-index:6}
.mpop button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:7px}
.mpop button[aria-selected="true"],.mpop button:hover{background:var(--accent-soft);color:var(--accent-text)}
.alsosend{order:-1;flex-basis:100%;white-space:nowrap;padding-bottom:4px!important;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:0 6px}
/* side */
.sh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.sh h2{margin:0;font-size:15px;font-weight:700;flex:1}
.sb{padding:14px 16px;overflow-y:auto;flex:1;min-height:0}
.sb h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.sb h3:first-child{margin-top:0}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--radius-sm);width:100%}
.mrow:hover{background:var(--hover)}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line);flex:none;transition:background .15s;cursor:pointer}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--on-accent)}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.sel{height:34px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:0 10px;color:var(--ink)}
.inp{height:36px;width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:0 10px;color:var(--ink);outline:0}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{height:auto;padding:8px 10px;resize:vertical}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 4px}
/* sections */
.sechead{display:flex;align-items:center;gap:12px;padding:18px 24px 10px;flex-wrap:wrap}
[data-eff="focus"] .sechead{padding:14px 20px 8px}
.sechead .title{flex:1;display:flex;align-items:center;gap:10px}
.secbody{flex:1;min-height:0;overflow-y:auto;padding:0 24px 24px}
[data-eff="focus"] .secbody{padding:0 20px 20px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 24px 12px}
[data-eff="focus"] .toolbar{padding:0 20px 10px}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 10px;border-radius:var(--radius-sm);border-bottom:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s;width:100%}
.item:hover{background:var(--surface-2)}
.item .udot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}
.item .udot.off{background:transparent}
.item .ib{opacity:.0}
.item:hover .ib,.item:focus-within .ib{opacity:1}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:56px 24px;color:var(--muted);flex:1}
.empty .eic{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.empty .eic .ic{width:26px;height:26px}
.empty b{color:var(--ink);font-size:15px}
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.fgc{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);transition:border-color .15s,box-shadow .15s;width:100%}
.fgc:hover{border-color:var(--muted)}
.fgc .th{height:104px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.fgc .th .ic{width:30px;height:30px}
.fgc .bd{padding:10px 12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:border-color .15s,box-shadow .15s;width:100%}
.pcard:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.pcard .av{--s:46px}
/* tasks */
.board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--radius);padding:10px;min-height:200px;border:1px solid transparent;transition:border-color .15s,background .15s}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col h3{margin:2px 6px 10px;font-size:12.5px;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.tcard{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tcard:hover{border-color:var(--muted)}
.tcard.drag{opacity:.4}
.tcard .tt{font-weight:600;margin-bottom:8px}
.tcard.done .tt{text-decoration:line-through;color:var(--muted)}
/* mail */
.mailwrap{flex:1;display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);min-height:0}
.mlist{border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.mi{display:flex;flex-direction:column;gap:1px;width:100%;padding:10px 16px;border-bottom:1px solid var(--line);transition:background .15s;position:relative}
.mi:hover{background:var(--surface-2)}
.mi[aria-current="true"]{background:var(--accent-soft)}
.mi .l1{display:flex;gap:8px;align-items:baseline}
.mi.un .fr,.mi.un .sj{font-weight:700;color:var(--ink)}
.mi .sj{color:var(--ink-2)}
.mread{overflow-y:auto;padding:22px 28px;min-height:0}
.mread h2{margin:0 0 10px;font-size:19px;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.mread p{margin:0 0 12px;white-space:pre-wrap;max-width:62ch}
.mrep{border-left:2px solid var(--line);padding-left:14px;margin:14px 0}
.folder{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line)}
/* overlays */
.ov{position:absolute;inset:0;pointer-events:none;z-index:20}
.ov > *{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--pop);width:min(520px,100%);max-height:100%;overflow:auto;border:1px solid var(--line)}
.modal .mhd{display:flex;align-items:center;padding:16px 18px 6px;gap:8px}
.modal .mhd h2{margin:0;font-size:17px;flex:1;font-family:"Bricolage Grotesque",sans-serif}
.modal .mbd{padding:6px 18px 12px}
.modal .mft{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px}
.menu{position:absolute;min-width:200px;max-width:min(300px,92%);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--pop);padding:4px;z-index:30}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:7px;color:var(--ink);min-height:32px}
.menu button:hover{background:var(--hover)}
.menu button.on{color:var(--accent-text);font-weight:600}
.menu button.dng{color:var(--danger)}
.menu hr{border:0;height:1px;background:var(--line);margin:4px 0}
.menu .mt{font-size:11.5px;color:var(--muted);padding:6px 10px 2px;font-weight:600}
.emojis{display:flex;flex-wrap:wrap;gap:2px;max-width:200px}
.menu .emojis button{width:40px;height:36px;justify-content:center;font-size:19px;padding:0}
.toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:40;width:min(480px,92%)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);padding:9px 12px 9px 14px;border-radius:var(--radius-sm);box-shadow:var(--pop);animation:tin .18s ease-out;font-weight:500}
.toast button{color:var(--accent);font-weight:700;padding:2px 6px}
[data-eff="calm"] .toast button{color:var(--accent-soft)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.pal{width:min(600px,100%);align-self:start;margin-top:8vh}
.pal .pin{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal .pin input{flex:1;border:0;background:transparent;outline:0;font-size:15px;color:var(--ink)}
.pres{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.pres .g{font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 10px 3px;text-transform:uppercase;letter-spacing:.05em}
.pres button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;min-height:38px}
.pres button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-text)}
.pres .av{--s:24px}
.pfoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface-2)}
.minibar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:25;display:flex;align-items:center;gap:12px;background:var(--stage-bar);color:var(--stage-ink);border:1px solid var(--stage-line);border-radius:99px;padding:6px 8px 6px 16px;box-shadow:var(--pop)}
.minibar .btn{height:30px;background:transparent;color:var(--stage-ink);border-color:var(--stage-line)}
.minibar .btn.leave{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.minibar .ldot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
/* meet */
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.livecard{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--surface);position:relative}
.livecard .lv{display:inline-flex;align-items:center;gap:6px;color:var(--live);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.faces{display:flex}
.faces .av{--s:38px;margin-left:-8px;border:2px solid var(--surface)}
.faces .av:first-child{margin-left:0}
.agrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.agrow .at{width:54px;font-weight:600}
.call{flex:1;display:flex;flex-direction:column;background:var(--stage);color:var(--stage-ink);min-height:0;position:relative}
.call .chead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--stage-line)}
.callmain{flex:1;display:flex;min-height:0}
.cstage{flex:1;min-width:0;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;position:relative}
.tiles{flex:1;display:grid;gap:12px;min-height:0;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));grid-auto-rows:1fr}
.tiles.n1{grid-template-columns:1fr}.tiles.n2{grid-template-columns:repeat(2,1fr)}.tiles.n3,.tiles.n4{grid-template-columns:repeat(2,1fr)}

.bars{flex:1;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--muted);position:relative}
.bars.thin{gap:1px}

.xax{display:flex;gap:4px;height:20px;padding-top:4px}
.bars.thin+.xax{gap:1px}
.xax span{flex:1;min-width:0;white-space:nowrap;overflow:visible;font-size:10.5px}
.tbl{margin-top:10px}

function mailUnread(){return D.mail.filter(m=>m.folder==='inbox'&&m.unread).length}
function laterOpen(){return D.later.filter(l=>!l.done).length}
function laterUnread(){return D.later.filter(l=>!l.done&&l.unread).length}
function tick(k){if(!S.done[k]){S.done[k]=true;R.proto();if(S.guide)R.guide()}}
function scrollPos(){const o={};$$('[data-scroll]').forEach(e=>o[e.dataset.scroll]=e.scrollTop);return o}
function restoreScroll(o,bottom){$$('[data-scroll]').forEach(e=>{const k=e.dataset.scroll;if(bottom&&bottom.indexOf(k)>=0)e.scrollTop=e.scrollHeight;else if(o[k]!=null)e.scrollTop=o[k]})}
function keepFocus(fn,bottom){
 const a=document.activeElement;let key=a&&a.dataset&&a.dataset.keep,ss=0,se=0;
 if(key){ss=a.selectionStart;se=a.selectionEnd}
 const sp=scrollPos();fn();restoreScroll(sp,bottom);
 if(key){const n=document.querySelector('[data-keep="'+key+'"]');if(n){n.focus({preventScroll:true});try{n.setSelectionRange(ss,se)}catch(e){}}}
}

 },

 msgs(bottom){const el=$('#msgs');if(!el){R.main(bottom);return}const sp=el.scrollTop;el.innerHTML=msgsHtml();el.scrollTop=bottom?el.scrollHeight:sp;highlight()},
 modal(){keepFocus(()=>{$('#ov-modal').innerHTML=modalHtml()});const f=$('#ov-modal [data-autofocus]');if(f&&!f.dataset.did){f.focus();f.dataset.did=1}},

function centerIn(el){const box=el.closest('[data-scroll]');if(!box)return;const er=el.getBoundingClientRect(),br=box.getBoundingClientRect();box.scrollTop+=er.top-br.top-box.clientHeight/2+er.height/2}

function go(sec,opts){
 opts=opts||{};
 if(sec==='more'){return}

 o=o||{};const c=conv(id);if(!c)return;if(!inConv(c)&&!S.guest){S.modal={type:'browse',q:''};R.modal();return}
 S.section='home';S.conv=id;S.convOpen=true;S.tab='messages';S.panel=null;S.msgQ='';S.msgQOpen=false;S.menu=null;S.actMsg=null;

}

function dayLabel(d){return d===0?'Yesterday':'Today'}
function msgsHtml(){
 const c=conv(S.conv);let list=D.msgs.filter(m=>m.c===c.id&&!m.parent);
 const q=S.msgQ.trim().toLowerCase();
 if(q)list=list.filter(m=>(m.text||'').toLowerCase().includes(q)||P(m.by).name.toLowerCase().includes(q));
 let h='';
 const snap=S.newSnap[c.id]||0;
 if(!q&&snap>0&&S.catch[c.id]!=='done'&&aiOn()){
  const st=S.catch[c.id];
  if(!st)h+='<div class="row catchrow"><button class="btn" data-action="catchup" data-id="'+c.id+'">'+icon('sparkles')+'Catch up · '+snap+' new</button>'+np()+'<span class="xs muted">Uses Claude on this computer</span></div>';
  else if(st==='loading')h+='<div class="sumcard loading"><h3>'+icon('sparkles')+'Summarising '+snap+' new messages…</h3><div class="muted sm">Claude on this computer is reading them.</div></div>';
  else h+=catchupHtml(c);
 }
 if(!list.length)return h+(q?emptyHtml('search','No messages match "'+q+'"','Try a different word.'):emptyHtml('home','This is the start of '+convName(c),'Say hello.'));
 let prev=null,lastDay=null;
 const newFrom=snap>0?list[Math.max(0,list.length-snap)]:null;
 list.forEach(m=>{
  if(m.day!==lastDay){h+='<div class="day">'+dayLabel(m.day)+'</div>';lastDay=m.day;prev=null}
  if(newFrom&&m===newFrom&&!q&&S.catch[c.id]!=='done')h+='<div class="day newdiv">New</div>';
  h+=msgHtml(m,prev,'main');prev=m;
 });
 const ty=S.typing[c.id];
 if(ty)h+='<div class="typing"><i></i><i></i><i></i> '+esc(P(ty).first)+' is typing…</div>';

 let h='<div class="msg'+(grp?' grp':'')+(mentioned?' mentioned':'')+(m.pending?' pending':'')+(S.actMsg===m.id?' act':'')+'" data-mid="'+m.id+'">';

/* ---------- AI features (Desktop app only): built from the messages in state ---------- */
const DECISION_RE=/\b(decision:|decided|we keep|let us keep|let's keep|agreed|is final|stays|goes into|that is the plan|we will go with|approved)\b/i;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function firstSentence(t,n){t=(t||'').replace(/\s+/g,' ').trim();const m=/^(.+?[.!?])(\s|$)/.exec(t);let s=m?m[1]:t;n=n||110;return s.length>n?s.slice(0,n-1).trim()+'…':s}
function describe(m){
 const a=(m.att||[])[0];const who=P(m.by).first;
 if(a&&a.kind==='poll')return who+' started a poll: '+a.q;
 if(a&&a.kind==='voice')return who+' sent a voice clip ('+fmtDur(a.dur)+')';
 if(a&&a.kind==='meet')return who+' started a Meet'+(a.title?': '+a.title:'');
 if(a&&a.kind==='approval')return who+' asked '+(a.approver===ME?'you':P(a.approver).first)+' to approve: '+firstSentence(a.text,80);
 if(a&&a.kind==='event'){const ev=D.events.find(x=>x.id===a.ev);return who+' scheduled a Meet'+(ev?': '+ev.title+', '+evWhen(ev):'')}
 const files=(m.att||[]).filter(x=>x.kind==='file').map(x=>x.name);
 const imgs=(m.att||[]).filter(x=>x.kind==='image').length;
 let s=who+': '+firstSentence(m.text.replace(/^Decision:\s*/i,''));
 if(!m.text&&files.length)s=who+' shared '+files.join(', ');
 else if(files.length)s+=' (shared '+files.join(', ')+')';
 else if(imgs)s+=' (with a screenshot)';
 const n=D.msgs.filter(x=>x.parent===m.id).length;if(n)s+=' · '+n+' '+(n===1?'reply':'replies');
 return s;
}
function waitingReason(m){
 if(m.by===ME)return null;
 const me=P(ME).first,t=m.text||'',a=(m.att||[])[0];
 if(a&&a.kind==='approval'&&a.state==='pending'&&a.approver===ME)return P(m.by).first+' is waiting for your approval: '+firstSentence(a.text,80);
 if(a&&a.kind==='poll'&&!a.opts.some(o=>o.v.includes(ME)))return 'Vote in '+P(m.by).first+'\'s poll: '+a.q;
 if(new RegExp('@'+me+'\\b').test(t))return P(m.by).first+' asked you: '+firstSentence(t.replace(new RegExp('@'+me+'\\s*'),''),100);
 const c=conv(m.c);if(c.type!=='channel'&&/\?/.test(t))return P(m.by).first+' asked: '+firstSentence(t,100);
 return null;
}
function summarise(msgs){
 const pts=[],dec=[],wait=[];
 msgs.forEach(m=>{
  if(m.by!==ME&&!(m.att||[]).some(a=>a.kind==='approval'))pts.push([describe(m),m.id]);
  else if((m.att||[]).some(a=>a.kind==='approval'))pts.push([describe(m),m.id]);
  if(DECISION_RE.test(m.text||''))dec.push([cap(firstSentence((m.text||'').replace(/^Decision:\s*/i,''),120))+' ('+P(m.by).first+')',m.id]);
  const w=waitingReason(m);if(w)wait.push([w,m.id]);
 });
 return {pts,dec,wait};
}
function unreadMsgs(cid,n){return D.msgs.filter(m=>m.c===cid&&!m.parent).slice(-n)}
const aiNote='<div class="ainote">'+icon('monitor')+'Made by Claude on this computer</div>';
function sumList(arr,cid,empty){
 if(!arr.length)return '<ul><li class="muted">'+esc(empty)+'</li></ul>';
 return '<ul>'+arr.map(x=>'<li>'+esc(x[0])+(x[1]?' <button class="linkbtn" data-action="jumpmsg" data-id="'+x[1]+'" data-c="'+(cid||msg(x[1]).c)+'">Go to message</button>':'')+'</li>').join('')+'</ul>';
}
function catchupHtml(c){

 return '<div class="sumcard"><h3>'+icon('sparkles')+'Catch-up'+np()+'<span class="muted" style="font-weight:400">· '+snap+' new message'+(snap===1?'':'s')+'</span></h3><div class="sl">What happened</div>'+sumList(shown,c.id,'Only your own messages.')+(more>0?'<div class="xs muted" style="margin:-6px 0 8px 18px">and '+more+' more</div>':'')
 +'<div class="sl">Decisions</div>'+sumList(r.dec,c.id,'Nothing was decided in these messages.')
 +'<div class="sl">Waiting on you</div>'+sumList(r.wait,c.id,'Nothing here needs you.')

const REPEAT={none:'Does not repeat',daily:'Every day',weekdays:'Every weekday',weekly:'Every week'};
function evEndHm(ev){const [h,m]=ev.start.split(':').map(Number);return hm(h*60+m+ev.len)}
function evWhen(ev){return dayName(ev.date,true)+', '+ev.start+'–'+evEndHm(ev)+(ev.repeat!=='none'?' · '+REPEAT[ev.repeat].toLowerCase():'')}
function occursOn(ev,d){
 if(d<ev.date)return false;if(ev.repeat==='none')return d===ev.date;if(ev.repeat==='daily')return true;
 if(ev.repeat==='weekdays'){const w=new Date(BASE+d*DAY).getDay();return w>0&&w<6}
 return (d-ev.date)%7===0;
}
function occurrences(from,to,filter){
 const out=[];
 for(let d=from;d<to;d++)D.events.forEach(ev=>{if(filter&&!filter(ev))return;if(occursOn(ev,d)){const s=at(d,ev.start);out.push({ev,day:d,id:ev.id+'@'+d,start:s,end:s+ev.len*60000})}});
 return out.sort((a,b)=>a.start-b.start);
}

 return out;
}

 const text=(textOverride!=null?textOverride:(D.drafts[key]||'')).trim();const fs=S.files[key]||[];
 if(!text&&!fs.length)return;
 const att=fs.map(f=>({kind:'file',name:f.name,size:f.size}));
 const pend=S.offline?{pending:true}:{};
 if(key.startsWith('c:')){
  const cid=key.slice(2);postMsg(Object.assign({c:cid,by:ME,text,att,sentLater:!!whenLabel},pend));
 }else if(key.startsWith('t:')){
  const root=msg(key.slice(2));postMsg(Object.assign({c:root.c,by:ME,text,att,parent:root.id},pend));
  if(S.alsoSend)postMsg(Object.assign({c:root.c,by:ME,text,att:[]},pend));
 }else if(key==='call'){postMsg(Object.assign({c:S.call.conv,by:ME,text,att,parent:S.call.root},pend))}
 if(textOverride==null){D.drafts[key]='';S.files[key]=[]}
 tick('send');if(S.offline)tick('offline');
