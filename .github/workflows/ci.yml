name: CI

# Eight independent checks on every pull request and on every push to main.
# Each job calls one root script; the logic lives in package.json, not here.
# No secret is used. The database below is throwaway and exists for one run.
#
# Every job always starts and reports, so the checks stay required on main. A job that has nothing to
# check skips its steps and passes: `changed.sh` reads the files of the pull request and decides
# (documents only: no end-to-end, ui parity, test, type check, build, size or i18n run). `lint` always runs, because
# `pnpm format:check` also reads the documents. A push to main runs everything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress.
# Runs on main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: bash .github/scripts/changed.sh typecheck >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: pnpm typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: toki
          POSTGRES_PASSWORD: toki-ci-throwaway
          POSTGRES_DB: toki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toki -d toki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://toki:toki-ci-throwaway@localhost:5432/toki_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: bash .github/scripts/changed.sh tests >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: pnpm test

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    # The sign-in cases of TOKI-023 run against the real server: a throwaway Postgres and Mailpit, the
    # versions of docker-compose.dev.yml. Nothing is skipped here: a service that is missing fails the step.
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: e2e-ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_URL: postgres://postgres:e2e-ci-throwaway@127.0.0.1:5432/postgres
      E2E_SMTP_HOST: 127.0.0.1
      E2E_SMTP_PORT: "1025"
      E2E_MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: bash .github/scripts/changed.sh e2e >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.changed.outputs.run == 'true'
        run: pnpm test:e2e
      - if: steps.changed.outputs.run == 'true'
        run: pnpm test:e2e:sign-in
      # Screenshots, videos and traces of every test, passed or failed (the configs keep all of them).
      # `!cancelled()` runs this after a failed step too.
      - if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/assets/
          if-no-files-found: ignore
          retention-days: 7

  parity:
    name: ui parity
    # The UI parity check (TOKI-109) compares the app with the prototype, in the Playwright container
    # for linux/arm64, the platform of the reference images. So it has a job of its own, on an arm
    # runner (free for a public repository), and not a step of the end-to-end job. A difference does
    # not fail the job: it goes into the job summary, with its images in the artifact. The job fails
    # only where no result can be given (a missing reference, a changed prototype copy).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: bash .github/scripts/changed.sh parity >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Only Node runs on the runner (tools/ui-parity/container.mjs); the container installs the rest.
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.changed.outputs.run == 'true'
        run: node tools/ui-parity/container.mjs test
      - if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        run: cat e2e/assets/parity/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: e2e/assets/parity/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: bash .github/scripts/changed.sh build >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: pnpm build

  size:
    name: bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: bash .github/scripts/changed.sh size >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: pnpm size

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: bash .github/scripts/changed.sh i18n >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: pnpm i18n:check
