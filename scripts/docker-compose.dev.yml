# The backing services Toki needs for development: Postgres, MinIO and Mailpit.
#
# Run it through the root scripts (`pnpm dev:up`, `pnpm dev:down`), or by hand
# from the repository root, so the values come from the root `.env`:
#
#   docker compose --env-file .env -f scripts/docker-compose.dev.yml <command>
#
# Every value is required: a name missing from `.env` stops Compose with that name.

name: toki-dev

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the server that runs during first-time setup listens on the
      # socket only, so it does not count as ready.
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO publishes no image any more; this one is built from the upstream
    # source at the release named in the tag (see Dockerfile.minio).
    image: toki-dev-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      # The repository root, so the Dockerfile sits beside CLAUDE.md. Nothing is
      # copied from it: Dockerfile.minio.dockerignore excludes every file.
      context: ..
      dockerfile: Dockerfile.minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:?set MINIO_PORT in .env}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:?set MINIO_CONSOLE_PORT in .env}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      # Keep caught mail on the volume; without this Mailpit uses a temporary
      # file that is lost when the container stops.
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:?set MAILPIT_SMTP_PORT in .env}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:?set MAILPIT_WEB_PORT in .env}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
